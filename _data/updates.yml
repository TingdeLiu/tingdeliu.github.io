# - slug：文章 URL 去掉首尾斜杠，例如 /VLN-Papers/ 写 VLN-Papers。
# - date：必须与文章当前的 date: 完全一致（加引号）。文章再次修订、date 变了以后，
#   旧说明自动不再显示，不会把上一次的改动说成这一次的。
# - zh / en：中文首页与英文首页各自显示的文字；缺 en 时英文首页只显示标题和日期。
#
# 新条目加在最上面；旧条目可以保留，不影响显示。

