<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
{% assign meta_description = page.excerpt | default: site.description | strip_html | normalize_whitespace %}
{% assign meta_title = page.title | default: site.name %}
{% assign meta_image = page.image | default: site.avatar %}
<meta name="author" content="{{ page.author | default: site.name | escape }}" />
<meta name="description" content="{{ meta_description | escape }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta property="og:site_name" content="{{ site.name | escape }}" />
<meta property="og:title" content="{{ meta_title | escape }}" />
<meta property="og:description" content="{{ meta_description | escape }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
<meta property="og:locale" content="{% if page_lang == 'en' %}en_US{% else %}zh_CN{% endif %}" />
<meta property="og:image" content="{{ meta_image | absolute_url }}" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ meta_title | escape }}" />
<meta name="twitter:description" content="{{ meta_description | escape }}" />
{% if language_source and language_translation %}
<link rel="alternate" hreflang="zh-CN" href="{{ language_source.url | absolute_url }}" />
<link rel="alternate" hreflang="en" href="{{ language_translation.url | absolute_url }}" />
{% endif %}
<meta name="google-site-verification" content="Jtxa1xy6N3_2RjVVFrZgXjPZ0AHklxJXQ1eQ6QXNWr8" />
