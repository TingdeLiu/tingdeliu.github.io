{% assign rp = include.post %}
<a class="rc-card blog-row" href="{{ rp.url | relative_url }}" data-research-row data-research-group="{{ include.group }}">
  <span class="blog-row-icon" aria-hidden="true">
    {% include group-icon.html group=include.group %}
  </span>
  <time class="blog-row-date" datetime="{{ rp.date | date_to_xmlschema }}">{{ rp.date | date: '%Y-%m-%d' }}</time>
  <h2 class="blog-row-title">{{ rp.title | escape }}</h2>
  {% include reading-time.html post=rp %}
</a>
