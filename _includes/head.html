<head>
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

  <!-- OpenGraph 是一种由 Facebook 推出的协议，用于在社交媒体上更好地展示网页内容。（在meta.html中定义） -->
  {% include meta.html %}
  <script src="{{ '/assets/js/language-switch.js' | relative_url }}" defer></script>

  {% include fonts.html %}

  <!--[if lt IE 9]>
    <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
  <![endif]-->

  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  {% if page.vla_survey %}
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/vla-survey.css" />
  <script src="{{ site.baseurl }}/assets/js/vla-survey.js" defer></script>
  {% endif %}
  {% unless page_lang == 'en' %}<link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />{% endunless %}
  <!-- 下面为网页的略缩图 -->
  <link rel="shortcut icon" href="{{ site.favicon }}">
  <!-- <link rel="shortcut icon" href="https://kwanwaipang.github.io/Poster_files/hku_logo.jpg"/> -->

  <!-- 使用 MathJax 3 的简化配置，仅在页面含公式时加载 -->
  {% if content contains '\(' or content contains '\[' or content contains '$' %}
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  {% endif %}

 <!--  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.css"> -->
  {% if site.gitalk %}
  <script src="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.min.js"></script>
  {% endif %}
  <script>
    (function(d) {
      var config = {
        kitId: 'vbt3gjx',
        scriptTimeout: 3000,
        async: true
      },
      h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
    })(document);
  </script>  


  <!-- 访客统计（Vercount，沿用不蒜子的 busuanzi_* 元素 ID）。
       必须在所有页面加载：计数发生在脚本运行时，文章页没有侧栏、不显示数字，但访问仍需计入；
       数字只在 nav.html 的侧栏里显示。 -->
  <script defer src="https://events.vercount.one/js"></script>

  <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->

</head>
