<text x="344" y="197" font-size="21" font-weight="700">Visual encoder</text>
<text x="344" y="241" font-size="17" transform="translate(0,0)">Encode visual content</text>
<text x="344" y="241" font-size="17" transform="translate(0,30)">Extract image features</text>
<text x="344" y="241" font-size="17" transform="translate(0,60)">Represent visual tokens</text>
