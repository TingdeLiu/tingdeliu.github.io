<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Vision-language models: bringing images into language modeling</title>
<desc id="desc">Example question: What color is the cup?. A typical generative VLM; other models support retrieval or representation learning.</desc>
