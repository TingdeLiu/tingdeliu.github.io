<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Machine learning: learning from different signals</title>
<desc id="desc">Learning paradigms describe where training signals come from.. These paradigms can be combined; deep learning and foundation models describe other dimensions.</desc>
<rect width="1200" height="540" rx="24" fill="#f5f3ed"/>
<g font-family="Arial, sans-serif" fill="#233b3a">
<text x="48" y="60" font-size="32" font-weight="700">Machine learning: learning from different signals</text>
<text x="48" y="100" font-size="19" fill="#596d67">Learning paradigms describe where training signals come from.</text>
<rect x="48" y="138" width="532" height="132" rx="16" fill="#fff3df" stroke="#cbd5ce"/>
<text x="72" y="175" font-size="23" font-weight="700">Supervised learning</text>
<text x="72" y="211" font-size="19">Inputs + labels → predictions</text>
<text x="72" y="237" font-size="19">Example: classify apples and bananas</text>
<rect x="606" y="138" width="532" height="132" rx="16" fill="#e8f2fb" stroke="#cbd5ce"/>
<text x="630" y="175" font-size="23" font-weight="700">Unsupervised learning</text>
<text x="630" y="211" font-size="19">Unlabeled data → discover structure</text>
<text x="630" y="237" font-size="19">Example: group similar observations</text>
<rect x="48" y="292" width="532" height="132" rx="16" fill="#e4ece7" stroke="#cbd5ce"/>
<text x="72" y="329" font-size="23" font-weight="700">Self-supervised learning</text>
<text x="72" y="365" font-size="19">Construct targets from the data itself</text>
<text x="72" y="391" font-size="19">Example: predict a masked image patch</text>
<rect x="606" y="292" width="532" height="132" rx="16" fill="#f5e7e3" stroke="#cbd5ce"/>
<text x="630" y="329" font-size="23" font-weight="700">Reinforcement learning</text>
<text x="630" y="365" font-size="19">Actions → interaction → rewards</text>
<text x="630" y="391" font-size="19">Learn a policy from experience</text>
<text x="48" y="492" font-size="17" fill="#596d67">These paradigms can be combined; deep learning and foundation models describe other dimensions.</text>
</g></svg>
