<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Deep learning: representations, architectures, training</title>
<desc id="desc">Neural networks learn multiple levels of representation from data.. Architecture describes the network; the objective and parameter updates belong to the training process.</desc>
<rect width="1200" height="540" rx="24" fill="#f5f3ed"/>
<g font-family="Arial, sans-serif" fill="#233b3a">
<text x="48" y="60" font-size="32" font-weight="700">Deep learning: representations, architectures, training</text>
<text x="48" y="100" font-size="19" fill="#596d67">Neural networks learn multiple levels of representation from data.</text>
<rect x="48" y="138" width="532" height="132" rx="16" fill="#fff3df" stroke="#cbd5ce"/>
<text x="72" y="175" font-size="23" font-weight="700">Data → representations → task</text>
<text x="72" y="211" font-size="19">Pixels, tokens, or signals enter a network</text>
<text x="72" y="237" font-size="19">Learn features that support the task</text>
<rect x="606" y="138" width="532" height="132" rx="16" fill="#e8f2fb" stroke="#cbd5ce"/>
<text x="630" y="175" font-size="23" font-weight="700">Choose and combine architectures</text>
<text x="630" y="211" font-size="19">CNN: spatial patterns; RNN: sequences</text>
<text x="630" y="237" font-size="19">Transformer: attention across tokens</text>
<rect x="48" y="292" width="532" height="132" rx="16" fill="#e4ece7" stroke="#cbd5ce"/>
<text x="72" y="329" font-size="23" font-weight="700">Define the training objective</text>
<text x="72" y="365" font-size="19">Compare predictions with training targets</text>
<text x="72" y="391" font-size="19">The loss guides parameter updates</text>
<rect x="606" y="292" width="532" height="132" rx="16" fill="#f5e7e3" stroke="#cbd5ce"/>
<text x="630" y="329" font-size="23" font-weight="700">Update and evaluate</text>
<text x="630" y="365" font-size="19">Backpropagation + optimizer → new weights</text>
<text x="630" y="391" font-size="19">Check generalization on held-out data</text>
<text x="48" y="492" font-size="17" fill="#596d67">Architecture describes the network; the objective and parameter updates belong to the training process.</text>
</g></svg>
